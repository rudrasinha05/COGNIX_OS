name: Foundation checks
on:
  push:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-uefi
      - run: cargo test --workspace
      - run: cargo run -p cognix-simulator
      - run: cargo build --manifest-path boot/Cargo.toml --target x86_64-unknown-uefi
